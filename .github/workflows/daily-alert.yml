name: Daily Economic Alert

on:
  schedule:
    # UTC 기준 매일 22:00 = 한국시간 매일 07:00 (다음날)
    - cron: "0 22 * * *"
  workflow_dispatch: {}

jobs:
  daily-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily alert check
        env:
          PYTHONPATH: scripts
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python scripts/run_daily.py

      - name: Commit report page (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "일일 속보 페이지 자동 생성"
            git push
          else
            echo "변경사항 없음 — 커밋/푸시 생략"
          fi
