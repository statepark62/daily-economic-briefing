name: Weekly Economic Briefing

on:
  schedule:
    # UTC 기준 매주 일요일 22:00 = 한국시간 매주 월요일 07:00
    - cron: "0 22 * * 0"
  workflow_dispatch: {}   # 수동 실행 버튼도 사용 가능

jobs:
  weekly-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly briefing
        env:
          PYTHONPATH: scripts
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python scripts/run_weekly.py

      - name: Commit report archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/weekly || true
          git diff --cached --quiet || git commit -m "주간 브리핑 아카이브 자동 커밋"
          git push
